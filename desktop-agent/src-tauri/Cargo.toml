[package]
name = "desktop-agent"
version = "1.0.0"
description = "Agente Desktop Multiplataforma para Prospecção Automática de Imóveis"
authors = ["Imóvel Fácil Team"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
regex = "1.10"
scraper = "0.18"
headless_chrome = "1.0.12"

[features]
custom-protocol = ["tauri/custom-protocol"]
